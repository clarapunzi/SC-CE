data:
  german_credit:
    path: "data/raw/german_credit.csv"
  folktables:
    path: "data/raw/folktables/"
  toy_data:
    path: "."

wandb:
  project_name: "counterfactuals-debug"
  tags: ["nested-cv", "counterfactuals"]

paths:
  models: "models/"
  counterfactuals: "counterfactuals/"

models:
  rf_params:
    model__n_estimators: [50,100, 150]
    model__max_depth: [6, 10, 30, null]
    model__min_samples_split: [2, 5, 10]
    model__min_samples_leaf: [1, 2, 4]

  lgbm_params:
    model__n_estimators: [50, 100, 150]
    model__max_depth: [-1, 6, 10, 30]
    model__learning_rate: [0.01, 0.05, 0.1]
    model__verbosity: [-1]
    
  xgb_params:
    model__n_estimators: [50,100, 150]
    model__max_depth: [3, 6, 9, null]
    model__learning_rate: [0.01, 0.05, 0.1]
    model__min_child_weight: [1, 3, 5]

  mlp_params:
    model__hidden_layer_sizes: [[32], [64], [32,32], [64, 32]]
    model__learning_rate_init: [0.001, 0.01, 0.1]
    model__max_iter: [150, 300, 500]

counterfactuals:
  num_counterfactuals: 8
  dice:
    proximity_weight: 0.5
    method: "kdtree"
  growing_spheres:
    lambda_param: 0.1
  lore:
    method: "random"